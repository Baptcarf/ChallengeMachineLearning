[project]
name = "automl"
version = "0.1.0"
description = "AutoML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "optuna",
    "joblib",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "jupyter",
    "ipykernel",
]

[tool.setuptools]
packages = ["automl"]